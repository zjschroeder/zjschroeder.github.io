  navbar:
    left:
      - text: Projects
        href: projects/index.qmd
      - text: Tools
        href: tools/index.qmd
      - text: Blog
        href: blog/index.qmd
      - text: Publications
        href: publications.qmd
      - text: About
        href: about.qmd
    right:
      - text: Résumé
        href: resume.pdf
      - icon: github
        href: https://github.com/zjschroeder
